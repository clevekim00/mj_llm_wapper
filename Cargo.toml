[package]
name = "mj-local-llm-hub"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
native-macos = ["mj-llm-runtime-litert/native-macos"]

[dependencies]
mj-llm-core = { path = "vendor/mj-llm/crates/app-core" }
mj-llm-runtime-litert = { path = "vendor/mj-llm/crates/runtime-litert" }
tempfile = "3"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
